name: ${COMPOSE_PROJECT_NAME:-dsriker}

x-sim-common: &sim-common
  build:
    context: .
    dockerfile: docker/Dockerfile
    args:
      ARDUPILOT_REF: ${ARDUPILOT_REF:-92b0cd788ec29406f26c6f9c31d5ceedbd1cc538}
  image: ${SIM_IMAGE:-dsriker-sim:dev}
  working_dir: /workspace
  volumes:
    - type: bind
      source: .
      target: /workspace
  environment:
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
    ARDUPILOT_REF: ${ARDUPILOT_REF:-92b0cd788ec29406f26c6f9c31d5ceedbd1cc538}
    SCENARIO: ${SCENARIO:-default}
    CAMERA_WIDTH: ${CAMERA_WIDTH:-640}
    CAMERA_HEIGHT: ${CAMERA_HEIGHT:-480}
    CAMERA_FPS: ${CAMERA_FPS:-15}
    CAMERA_TOPIC: ${CAMERA_TOPIC:-/sim/camera/image_raw}
  tty: true
  stdin_open: true

services:
  sitl:
    <<: *sim-common
    command: ["bash", "-lc", "sleep infinity"]

  physics:
    <<: *sim-common
    command: ["bash", "-lc", "sleep infinity"]

  physics-stub:
    <<: *sim-common
    profiles: ["json-stub"]
    init: true
    expose:
      - "9002/udp"
    command: ["python3", "-m", "src.physics.ardupilot_json_stub"]

  ros2:
    <<: *sim-common
    expose:
      - "14550/udp"
    command: ["bash", "-lc", "sleep infinity"]

  sitl-baseline:
    <<: *sim-common
    profiles: ["baseline"]
    depends_on:
      - ros2
    init: true
    user: ardupilot
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        export HOME=/home/ardupilot
        export USER=ardupilot
        cd /opt/ardupilot
        echo "Starting baseline ArduCopter SITL with built-in physics"
        echo "MAVProxy disabled via --no-mavproxy"
        echo "Explicit MAVLink route: --out=udp:ros2:14550"
        echo "Direct SITL serial0 route: --serial0=udpclient:ros2:14550"
        exec Tools/autotest/sim_vehicle.py -v ArduCopter -f quad --no-rebuild --no-mavproxy --out=udp:ros2:14550 --sitl-instance-args=--serial0=udpclient:ros2:14550

  sitl-json:
    <<: *sim-common
    profiles: ["json-stub"]
    depends_on:
      - physics-stub
    init: true
    user: ardupilot
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        export HOME=/home/ardupilot
        export USER=ardupilot
        export SITL_RITW_TERMINAL=bash
        cd /opt/ardupilot
        PHYSICS_STUB_HOST=physics-stub
        PHYSICS_STUB_IP="$$(python3 -c 'import socket; print(socket.gethostbyname("physics-stub"))')"
        test -n "$${PHYSICS_STUB_IP}"
        echo "Starting ArduCopter SITL in JSON external-physics mode"
        echo "JSON model target service: --model JSON:$${PHYSICS_STUB_HOST}"
        echo "Resolved $${PHYSICS_STUB_HOST} to $${PHYSICS_STUB_IP} for ArduPilot numeric IPv4"
        echo "MAVProxy disabled via --no-mavproxy"
        echo "ArduPilot child output inherited via SITL_RITW_TERMINAL=bash"
        echo "Direct SITL serial0 UDP sink: --serial0=udpclient:127.0.0.1:14550"
        exec Tools/autotest/sim_vehicle.py -v ArduCopter -f quad --no-rebuild --no-mavproxy --model "JSON:$${PHYSICS_STUB_IP}" --sitl-instance-args=--serial0=udpclient:127.0.0.1:14550

  viz:
    <<: *sim-common
    profiles: ["viz"]
    ports:
      - "${FOXGLOVE_PORT:-8765}:8765"
    command: ["bash", "-lc", "sleep infinity"]

  test:
    <<: *sim-common
    profiles: ["test"]
    command:
      - bash
      - -lc
      - test -f /workspace/README.md && printf 'scaffold-ok\n'
